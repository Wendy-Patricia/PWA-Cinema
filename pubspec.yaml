name: acteurs
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  custom_cached_image: ^1.7.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/profile.jpg
    - assets/cinema.svg
    - assets/images/level1.png
    - assets/images/level2.png
    - assets/images/level3.png
    - assets/images/level1f.png
    - assets/images/level2f.png
    - assets/images/level3f.png

